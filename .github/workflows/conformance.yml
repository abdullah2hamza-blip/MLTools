name: Conformance validation

# Opt-in hosted execution; all checks also run locally with the documented commands.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kaggle-release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.4"
          python-version: "3.13"
      - run: uv venv .venv-kaggle --python 3.13
      - run: uv pip sync releases/kaggle/testing-requirements.lock --python .venv-kaggle/Scripts/python.exe --require-hashes
      - run: .venv-kaggle/Scripts/python.exe -m pytest releases/kaggle -q --basetemp .test-tmp/kaggle-tests
      - run: .venv-kaggle/Scripts/python.exe releases/kaggle/build.py --output releases/kaggle/build/ci
      - run: .venv-kaggle/Scripts/python.exe releases/kaggle/publish.py --root releases/kaggle/build/ci --config releases/kaggle/config.json
      - run: .venv-kaggle/Scripts/python.exe releases/kaggle/smoke.py --root releases/kaggle/build/ci --work .test-tmp/kaggle-smoke --record releases/kaggle/build/ci-validation
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.4"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check src tests scripts examples/so101/build_cases.py
      - run: uv run ruff format --check src tests scripts examples/so101/build_cases.py
      - run: uv build
      - run: uv run --isolated --no-project --with ./dist/mltools-0.1.0-py3-none-any.whl mltools check examples/so101/good.json --trace examples/so101/good.trace.json
  lerobot:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.4"
          python-version: "3.13"
      - run: uv sync --locked --extra lerobot
      - run: uv run --extra lerobot pytest -q
      - run: uv run --extra lerobot python scripts/validate_examples.py
